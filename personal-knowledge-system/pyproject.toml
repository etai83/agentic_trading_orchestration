[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-knowledge-system"
version = "0.1.0"
description = "Catalog and search notes, project docs, and other eligible files"
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
knowledge-system = "knowledge_system.cli:main"

[tool.setuptools.packages.find]
include = ["knowledge_system*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
