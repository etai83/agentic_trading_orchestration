[project]
name = "ato"
version = "0.1.0"
description = "Agentic Trading Orchestration — Phase 1 library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ato"]

[tool.uv]
package = true

[tool.uv.workspace]
members = ["apps/ops-api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests", "apps/ops-api"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
