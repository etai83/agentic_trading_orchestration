[project]
name = "ops-api"
version = "0.1.0"
description = "ATO Phase 1 ops dashboard API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "ato",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_api"]

[tool.uv.sources]
ato = { workspace = true }
